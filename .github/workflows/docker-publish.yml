name: Build and Publish Docker Image

on:
  push:
    tags:
      - 'v*'            # 仅打 v* tag 时触发（如 v1.0.0、v1.0.0-beta）
  workflow_dispatch: {} # 也支持手动从 Actions 页面触发

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # 推送到 GHCR 需要的权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # 自动提供，无需额外配 Secret

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}            # v1.0.0 -> 1.0.0
            type=semver,pattern={{major}}.{{minor}}    # v1.0.0 -> 1.0
            type=semver,pattern={{major}}               # v1.0.0 -> 1
            type=raw,value=latest,enable=${{ !github.event.dispatch }} # 非 dispatch 时打 latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
